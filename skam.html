<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MyBank</title>
    <style>
        body {
            background-color: #f3f4f6;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            position: relative;
        }
        .image-container {
            position: absolute;
            height: 100%;
            width: 20%;
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .image-left {
            left: 0;
        }
        .image-right {
            right: 0;
        }
        .image-container img {
            max-width: 80%;
            height: auto;
        }
        .login-container {
            background-color: #ffffff;
            padding: 30px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            width: 300px;
            text-align: center;
            z-index: 1;
        }
        .login-container h2 {
            margin-bottom: 20px;
            color: #333;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .login-button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }
        .login-button:hover {
            background-color: #0056b3;
        }
        .warning {
            margin-top: 20px;
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Left Image -->
    <div class="image-container image-left">
        <img src="https://raw.githubusercontent.com/nikoffer1/AR-DNA-BIO/refs/heads/main/phot2.png" alt="Security Illustration">
    </div>

    <!-- Login Form -->
    <div class="login-container">
        <h2>BunelniuBank Login</h2>
        <form id="login-form">
            <input type="text" id="username" placeholder="Numarul de Telefon" required><br>
            <input type="password" id="password" placeholder="Parola" required><br>
            <input type="text" id="card" placeholder="Numarul Cardului" required><br>
            <input type="text" id="cvv" placeholder="CVV" required><br>
            <button type="submit" class="login-button">Login</button>
        </form>
        <div class="warning">
            <p>PRECIS NUI SCAM! STARIY BOG.ATREIYA</p>
        </div>
    </div>

    <!-- Right Image -->
    <div class="image-container image-right">
        <img src="https://raw.githubusercontent.com/nikoffer1/AR-DNA-BIO/refs/heads/main/kol1.png" alt="Hacker Illustration">
    </div>

    <script>
        // Save user input to a text file (only for demo purposes)
        document.getElementById('login-form').addEventListener('submit', function (event) {
            event.preventDefault(); // Prevent form submission

            // Get the input values
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Format the data
            const data = `Username: ${username}\nPassword: ${password}\n`;

            // Create a blob and save it as a .txt file
            const blob = new Blob([data], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'credentials.txt';
            link.click();
        });
    </script>
</body>
</html>
