<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BLE Device Scanner</title>
  <style>
    body, html {
      height: 100%;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
    }
    #container {
      text-align: center;
    }
    button {
      font-size: 1.2em;
      padding: 10px 20px;
      cursor: pointer;
    }
    #deviceList {
      margin-top: 20px;
      text-align: left;
      display: inline-block;
    }
    li {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <div id="container">
    <button id="scanButton">Scan for BLE Devices</button>
    <ul id="deviceList"></ul>
    <div id="errorMessage" style="color:red; margin-top:10px;"></div>
  </div>

  <script>
    const scanButton = document.getElementById('scanButton');
    const deviceList = document.getElementById('deviceList');
    const errorMessage = document.getElementById('errorMessage');

    scanButton.addEventListener('click', async () => {
      // Clear previous results
      deviceList.innerHTML = '';
      errorMessage.textContent = '';

      try {
        // Using acceptAllDevices for now; you can add filters later if needed.
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: []  // You can list service UUIDs here if needed.
        });

        // Device selected successfully; display the device details.
        const li = document.createElement('li');
        li.textContent = `Name: ${device.name || 'Unknown'}, ID: ${device.id}`;
        deviceList.appendChild(li);
        console.log('Device selected:', device);

      } catch (error) {
        console.error('Error during device scan:', error);
        errorMessage.textContent = 'Error: ' + error.message;
      }
    });
  </script>
</body>
</html>
